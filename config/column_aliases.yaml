# Maps a canonical field name (used everywhere in src/ncaa_scout) to the list of
# header spellings different export tools use for that same field.
#
# Column headers are normalized before matching: lowercased, stripped, spaces/dashes
# collapsed to underscores. If your CSV uses a header not listed here, either add it
# to the right list below, or rename the column in your export — no code changes needed.

# --- identity / context columns (pitch-by-pitch or event-level files) ---
batter_name: [batter, batter_name, hitter, hitter_name, player]
pitcher_name: [pitcher, pitcher_name]
batter_hand: [batterhand, batter_hand, batside, stand]
pitcher_hand: [pitcherhand, pitcher_hand, throws, p_throws]
ball_strike_count: [count, ball_strike_count]
inning_half: [inn, inning_half]
ab_num_in_game: [abnumingame, ab_num_in_game]
pitch_num_in_ab: [pitchnuminab, pitch_num_in_ab]
spin_direction: [spindir, spin_direction, spin_axis]
game_id: [gameid, game_id]
# pitchType/pitchtype is TrackMan's own header AND, coincidentally, TruMedia's
# short-code column (FA/SL/CH/...) in the same movement export that also has
# pitchTypeFull (Fastball/Slider/...). When both are present in one file,
# apply_column_aliases keeps the later-listed column on a canonical-name
# collision, and pitchTypeFull is listed after pitchType in that export —
# so the readable full name wins over the short code.
pitch_type: [pitch_type, pitchtype, pitchtypefull, taggedpitchtype, autopitchtype, pitch]
date: [date, game_date]

# --- box score / aggregate counting stats ---
pa: [pa, plate_appearances]
ab: [ab, at_bats]
h: [h, hits]
b1: [1b, singles, single]
b2: [2b, doubles, double]
b3: [3b, triples, triple]
hr: [hr, home_runs, homerun, homeruns]
bb: [bb, walks, uibb, ubb]
ibb: [ibb, intentional_walks]
hbp: [hbp, hit_by_pitch]
so: [so, k, strikeouts, so_]
sf: [sf, sac_fly, sac_flies]
sh: [sh, sac_bunt, sacrifice_bunt]
r: [r, runs, runs_scored]
rbi: [rbi, rbis]
sb: [sb, stolen_bases]
cs: [cs, caught_stealing]

# --- pitching box score / aggregate stats ---
bf: [bf, batters_faced, tbf]
ip: [ip, innings_pitched]
er: [er, earned_runs]
hr_allowed: [hr_allowed, hrallowed]

# --- trackman / yakkertech pitch-level batted-ball & pitch metrics ---
exit_speed: [exitspeed, exit_speed, ev, launch_speed, exitvelocity]
launch_angle: [angle, launch_angle, launchangle]
distance: [distance, hit_distance]
play_result: [playresult, play_result, result]
# pitchresult is TruMedia's descriptive per-pitch outcome ("Strikeout (Swinging)",
# "Single on a Ground Ball", ...) — see src/ncaa_scout/pitch_outcomes.py for how
# that vocabulary is classified alongside TrackMan's PitchCall enum.
pitch_call: [pitchcall, pitch_call, call, pitchresult]
kor_bb: [korbb, kor_bb]
# releasevelocity/vel are TruMedia's movement-export names for pitch velocity.
rel_speed: [relspeed, rel_speed, velo, velocity, releasevelocity, vel]
spin_rate: [spinrate, spin_rate, spin]
induced_vert_break: [inducedvertbreak, ivb, induced_vert_break]
horz_break: [horzbreak, hvb, horz_break, horizontal_break]
rel_height: [relheight, rel_height]
rel_side: [relside, rel_side]
extension: [extension]
plate_loc_height: [platelocheight, plate_loc_height, loc_height]
plate_loc_side: [platelocside, plate_loc_side, loc_side]
tagged_hit_type: [taggedhittype, tagged_hit_type, hit_type]

# --- synergy-style qualitative/tag columns (best-effort; often notes, not numbers) ---
swing_decision: [swing_decision, decision]
zone_tag: [zone, in_zone]
